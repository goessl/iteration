[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iteration"
version = "1.0"
description = "Exact iteration tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
  {name="Sebastian Gössl", email="goessl@student.tugraz.at"}
]

[project.urls]
Homepage = "https://github.com/goessl/iteration"
Documentation = "https://goessl.github.io/iteration"
Repository = "https://github.com/goessl/iteration.git"

[project.optional-dependencies]
test = ["pytest"]
